<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>מחברת סופר־חכמה</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--txt:#17202b;--mut:#8993a2;--acc:#5b67e8;--line:#e7ebf0;--rad:18px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:Arial,sans-serif;transition:.25s}button,input,textarea{font:inherit}button{cursor:pointer;border:0}
.app{width:100%;max-width:393px;min-height:100vh;margin:auto;padding:15px 13px 88px}.top{display:flex;align-items:center;gap:10px;margin:4px 2px 15px}.brand{flex:1}.brand b{font-size:21px}.brand small{display:block;color:var(--mut);font-size:10px;margin-top:3px}.icon{width:40px;height:40px;border-radius:13px;background:var(--card);box-shadow:0 5px 18px #1720330d}.search{height:45px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 14px;outline:0;margin-bottom:11px}.chips{display:flex;gap:6px;overflow:auto;padding-bottom:3px}.chip{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:7px 11px;font-size:10px;white-space:nowrap}.chip.active{background:var(--acc);color:white;border-color:var(--acc)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}.stat b{font-size:16px}.stat span{display:block;color:var(--mut);font-size:8px;margin-top:3px}.section{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 8px}.section b{font-size:12px}.note{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:13px;margin-bottom:8px;box-shadow:0 5px 18px #17203309}.notehead{display:flex;gap:9px;align-items:center}.dot{width:31px;height:31px;border-radius:10px;display:grid;place-items:center;background:#eef0ff}.note h3{font-size:12px;margin:0;flex:1}.note p{font-size:10px;color:var(--mut);line-height:1.55;margin:9px 0 4px;white-space:pre-wrap}.meta{font-size:8px;color:var(--mut);display:flex;gap:9px}.empty{text-align:center;padding:40px 10px;color:var(--mut)}.fab{position:fixed;bottom:18px;right:calc(50% - 170px);width:55px;height:55px;border-radius:18px;background:var(--acc);color:white;font-size:25px;box-shadow:0 12px 28px color-mix(in srgb,var(--acc) 35%,transparent)}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(393px,100%);height:57px;background:color-mix(in srgb,var(--card) 94%,transparent);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center}.nav{background:none;color:var(--mut);font-size:9px}.nav.active{color:var(--acc);font-weight:800}.modal{position:fixed;inset:0;background:#0005;display:none;align-items:flex-end;justify-content:center;z-index:10}.box{width:min(393px,100%);max-height:90vh;overflow:auto;background:var(--card);border-radius:25px 25px 0 0;padding:18px 15px}.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.mh b{font-size:17px}.close{width:34px;height:34px;border-radius:11px;background:var(--bg)}.field{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px;margin:6px 0;outline:0}.primary{width:100%;padding:12px;border-radius:13px;background:var(--acc);color:#fff;font-weight:800;margin-top:7px}.themegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.theme{padding:10px;border:2px solid var(--line);border-radius:15px;background:var(--card)}.theme.sel{border-color:var(--acc)}.preview{height:26px;border-radius:8px;margin-bottom:6px}.theme b{font-size:10px}.theme small{display:block;color:var(--mut);font-size:8px;margin-top:2px}
.t1{--bg:#f5f7fb;--card:#fff;--txt:#17202b;--acc:#5b67e8;--line:#e7ebf0}.t2{--bg:#11151d;--card:#191f29;--txt:#f2f5fa;--mut:#98a2b2;--acc:#7c8cff;--line:#2b3442}.t3{--bg:#f3eddf;--card:#fffaf0;--txt:#3b3328;--mut:#988d7c;--acc:#9b6b32;--line:#e4d7c2}.t4{--bg:#eaf1f8;--card:#ffffffcc;--txt:#1a2735;--mut:#708093;--acc:#3c83d9;--line:#d5e2ef}.t5{--bg:#080b0a;--card:#0e1411;--txt:#b9ffc9;--mut:#6d9c79;--acc:#31e875;--line:#1b3b25}.t6{--bg:#fff5fb;--card:#fff;--txt:#292133;--mut:#9c8ca8;--acc:#e84f9b;--line:#f3d9e8}
.t3 *{font-family:Georgia,serif}.t5 *{font-family:"Courier New",monospace}.t5 .note{box-shadow:0 0 0 1px #173d24}.t6 .note{box-shadow:0 9px 22px #d84e9818}
</style></head><body class="t1"><div class="app">
<div class="top"><div class="brand"><b>📝 מחברת חכמה</b><small>הפתקים שלך, מסודרים ופשוטים</small></div><button class="icon" onclick="openSettings()">⚙️</button></div>
<input id="search" class="search" placeholder="🔎 חיפוש בכל הפתקים..." oninput="render()">
<div class="chips"><button class="chip active" onclick="filterBy('all',this)">הכול</button><button class="chip" onclick="filterBy('work',this)">עבודה</button><button class="chip" onclick="filterBy('personal',this)">אישי</button><button class="chip" onclick="filterBy('tasks',this)">משימות</button></div>
<div class="stats"><div class="stat"><b id="cnt">0</b><span>פתקים</span></div><div class="stat"><b id="done">0</b><span>משימות</span></div><div class="stat"><b id="folders">3</b><span>קטגוריות</span></div></div>
<div class="section"><b>הפתקים האחרונים</b><button class="chip" onclick="openEditor()">＋ חדש</button></div><div id="notes"></div>
</div><button class="fab" onclick="openEditor()">＋</button>
<div class="bottom"><button class="nav active">📝<br>פתקים</button><button class="nav" onclick="filterBy('tasks')">☑️<br>משימות</button><button class="nav" onclick="openSettings()">⚙️<br>הגדרות</button></div>

<div id="edit" class="modal"><div class="box"><div class="mh"><b>פתק חדש</b><button class="close" onclick="closeModal('edit')">✕</button></div><input id="title" class="field" placeholder="כותרת"><textarea id="body" class="field" rows="8" placeholder="כתוב כאן..."></textarea><select id="cat" class="field"><option value="work">עבודה</option><option value="personal">אישי</option><option value="tasks">משימות</option></select><label class="field" style="display:block">🖼️ תמונה <input id="img" type="file" accept="image/*"></label><button class="primary" onclick="saveNote()">שמור פתק</button></div></div>

<div id="settings" class="modal"><div class="box"><div class="mh"><div><b>⚙️ הגדרות</b><small style="display:block;color:var(--mut);font-size:9px;margin-top:3px">פשוט, נקי, בלי עומס</small></div><button class="close" onclick="closeModal('settings')">✕</button></div>
<div style="font-size:11px;font-weight:900;margin:5px 2px 8px">🎨 בחר ממשק</div><div class="themegrid" id="themes"></div>
<div class="section" style="margin-top:18px"><b>כלים חשובים</b></div>
<button class="field" onclick="exportNotes()">💾 גיבוי פתקים</button><button class="field" onclick="clearNotes()">🗑️ מחיקת כל הפתקים</button>
</div></div>
<script>
let notes=JSON.parse(localStorage.getItem('smartNotes')||'[]'),filter='all';
const themes=[['t1','✨ מינימליסטי','נקי ובהיר'],['t2','🌙 לילה','כהה ומרשים'],['t3','📖 מחברת נייר','חמים וקלאסי'],['t4','💎 זכוכית','מודרני'],['t5','⌨️ טרמינל','טכני'],['t6','🎨 Color Pop','צבעוני']];
function render(){let q=(search.value||'').trim().toLowerCase(),arr=notes.filter(n=>(filter==='all'||n.cat===filter)&&(!q||(n.title+n.body).toLowerCase().includes(q)));cnt.textContent=notes.length;done.textContent=notes.filter(n=>n.cat==='tasks').length;notesEl=document.getElementById('notes');notesEl.innerHTML=arr.length?arr.map((n,i)=>'<div class="note"><div class="notehead"><div class="dot">'+(n.cat==='tasks'?'☑️':n.cat==='work'?'💼':'📝')+'</div><h3>'+esc(n.title||'ללא כותרת')+'</h3><button onclick="del('+n.id+')">⋮</button></div><p>'+esc(n.body)+'</p><div class="meta"><span>'+n.cat+'</span><span>'+new Date(n.id).toLocaleDateString('he-IL')+'</span>'+(n.lock?'🔒 נעול':'')+'</div></div>').join(''):'<div class="empty">📝<br><br>עדיין אין כאן פתקים<br>לחץ על ＋ כדי להתחיל</div>'}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function filterBy(f,b){filter=f;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');render()}
function openEditor(){document.getElementById('edit').style.display='flex';title.value='';body.value=''}
function saveNote(){let t=title.value.trim(),b=body.value.trim();if(!t&&!b)return;notes.unshift({id:Date.now(),title:t,body:b,cat:cat.value});localStorage.setItem('smartNotes',JSON.stringify(notes));closeModal('edit');render()}
function del(id){if(confirm('למחוק את הפתק?')){notes=notes.filter(n=>n.id!==id);localStorage.setItem('smartNotes',JSON.stringify(notes));render()}}
function closeModal(id){document.getElementById(id).style.display='none'}
function openSettings(){document.getElementById('settings').style.display='flex';renderThemes()}
function renderThemes(){let cur=localStorage.getItem('theme')||'t1';themesEl=document.getElementById('themes');themesEl.innerHTML=themes.map(x=>'<button class="theme '+(cur===x[0]?'sel':'')+'" onclick="setTheme(\''+x[0]+'\')"><div class="preview '+x[0]+'" style="background:var(--bg)"></div><b>'+x[1]+'</b><small>'+x[2]+'</small></button>').join('')}
function setTheme(t){document.body.className=t;localStorage.setItem('theme',t);renderThemes()}
function exportNotes(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(notes,null,2)],{type:'application/json'}));a.download='smart-notes-backup.json';a.click()}
function clearNotes(){if(confirm('למחוק את כל הפתקים?')){notes=[];localStorage.setItem('smartNotes','[]');render()}}
(function(){let t=localStorage.getItem('theme')||'t1';document.body.className=t;render()})()
</script></body></html>
