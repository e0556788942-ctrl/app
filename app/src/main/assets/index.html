<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=400,initial-scale=1,maximum-scale=1,user-scalable=no"><title>2048 Ultra M393</title><style>
:root{--bg:#f4f1ea;--card:#fffaf0;--t:#3c3a32;--mut:#7d7769;--a:#8f6bff;--b:#bbada0;--e:#cdc1b4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,Arial,sans-serif;user-select:none}.app{max-width:400px;margin:auto;padding:7px}.top{display:flex;align-items:center;gap:7px}.logo{width:42px;height:42px;border-radius:12px;background:var(--a);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:900}.brand{flex:1}.brand b{font-size:19px}.brand small{display:block;color:var(--mut);font-size:9px}.top button,.tabs button,.mode,.primary,.theme{border:0;border-radius:9px;background:var(--card);color:var(--t);padding:8px}.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:8px 0}.score{background:var(--card);border-radius:10px;text-align:center;padding:6px}.score b{display:block;font-size:16px}.score span{font-size:8px;color:var(--mut)}.game{background:var(--card);border-radius:15px;padding:6px}.board{background:var(--b);padding:6px;display:grid;gap:5px;border-radius:10px;touch-action:none}.cell{aspect-ratio:1;background:var(--e);border-radius:6px;display:grid;place-items:center;font-weight:900;font-size:clamp(17px,7vw,31px)}.cell[data-v="2"]{background:#eee4da}.cell[data-v="4"]{background:#ede0c8}.cell[data-v="8"]{background:#f2b179;color:#fff}.cell[data-v="16"]{background:#f59563;color:#fff}.cell[data-v="32"]{background:#f67c5f;color:#fff}.cell[data-v="64"]{background:#f65e3b;color:#fff}.cell[data-v="128"],.cell[data-v="256"],.cell[data-v="512"]{background:#edcc61;color:#fff}.cell[data-v="1024"],.cell[data-v="2048"]{background:#edc53f;color:#fff;font-size:21px}.cell.high{background:#3c3a32;color:#fff;font-size:16px}.hint{text-align:center;color:var(--mut);font-size:9px;margin:5px}.tabs{display:flex;gap:4px;margin-top:7px}.tabs button{flex:1;font-size:10px}.tabs .on,.primary{background:var(--a);color:#fff}.panel{display:none;background:var(--card);border-radius:12px;margin-top:5px;padding:7px}.panel.on{display:block}select{width:100%;padding:8px;border:0;border-radius:8px;background:#eee9df;color:var(--t)}.modes{display:grid;grid-template-columns:1fr 1fr;gap:4px;max-height:235px;overflow:auto;margin-top:5px}.mode{text-align:right;font-size:10px}.mode small{display:block;color:var(--mut);font-size:8px}.mode.sel{outline:2px solid var(--a)}.row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #0001;font-size:10px}.ach{padding:7px;background:#eee9df;border-radius:8px;margin:4px 0;font-size:10px}.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;padding:14px}.box{width:min(390px,100%);background:var(--card);border-radius:18px;padding:15px}.themes{display:grid;grid-template-columns:1fr 1fr;gap:5px}.theme.sel{outline:2px solid var(--a)}
</style><body><div class="app"><div class="top"><div class="logo">2048</div><div class="brand"><b>2048 Ultra · M393</b><small>100 מצבים • אופליין • שמירה אוטומטית</small></div><button onclick="setOpen(1)">⚙️</button></div><div class="scores"><div class="score"><b id="sc">0</b><span>ניקוד</span></div><div class="score"><b id="be">0</b><span>שיא</span></div><div class="score"><b id="mv">0</b><span>מהלכים</span></div></div><div class="game"><div id="board" class="board"></div><div class="hint">החלק על הלוח או השתמש בחצים</div></div><div class="tabs"><button class="on" onclick="tab('m',this)">100 מצבים</button><button onclick="tab('d',this)">🎯 יומי</button><button onclick="tab('s',this)">📊 מידע</button></div><div id="m" class="panel on"><select id="size" onchange="newGame()"><option value="4">4×4</option><option value="5">5×5</option><option value="6">6×6</option></select><div id="modes" class="modes"></div></div><div id="d" class="panel"><b>🎯 משימות היום</b><div id="daily"></div></div><div id="s" class="panel"><div id="info"></div><b>🏆 הישגים</b><div id="ach"></div></div><button class="primary" style="width:100%;margin-top:6px" onclick="newGame()">משחק חדש</button></div><div id="modal" class="modal" onclick="if(event.target===this)setOpen(0)"><div class="box"><button onclick="setOpen(0)">✕</button><h3>🎨 התאמה אישית</h3><div id="themes" class="themes"></div></div></div>
<script>
const N=["קליל","קלאסי","מהיר","איטי","מרתון","ספרינט","זמן מוגבל","מהלכים מוגבלים","בלי 2","בלי 4","אריחים קפואים","אריחים כפולים","מכשולים","חורים","לוח מתרחב","לוח מתכווץ","פינות בלבד","מרכז בלבד","קצוות בלבד","זיגזג","מספרי ענק","מטרה 128","מטרה 256","מטרה 512","מטרה 1024","מטרה 2048","מטרה 4096","מטרה 8192","צבעים","קשת","הפוך","מראה","סיבוב","אלכסון","ללא ימינה","ללא שמאלה","ללא למעלה","ללא למטה","כוח כבידה","כבידה הפוכה","קומבו","שרשרת","מיזוג כפול","מיזוג משולש","בונוס ניקוד","ניקוד הפוך","ניקוד זמן","שיא אישי","אתגר יומי","אתגר שבועי","אימון","מתחילים","מתקדמים","מקצוענים","מאסטר","אגדי","אקראי","הפתעה","רק זוגיים","רק אי-זוגיים","חזקות של 2","פיבונאצ'י","פריים","מינימליסטי","מקסימליסטי","ללא אנימציה","טורבו","רגוע","צבע מתחלף","לוח שחור","לוח לבן","אריח זהב","אריח כסף","אריח יהלום","בוס","שרידות","זמן שיא","10 מהלכים","25 מהלכים","50 מהלכים","100 מהלכים","200 מהלכים","ללא Undo","Undo חופשי","חיים","שלושה לבבות","החמצה אחת","מלך הפינות","מלך המרכז","אספן","מהיר ועצבני","מחשבה תחילה","דיוק","אולטרה","ניצחון נקי","אתגר 100","הכול פתוח","אינסופי"];
let S=4,g=[],score=0,moves=0,h=[],mode=0,st=JSON.parse(localStorage.uSt||"{}");
function makeModes(){modes.innerHTML=N.map((n,i)=>'<button class="mode '+(i==mode?"sel":"")+'" onclick="mode='+i+';makeModes();newGame()"><b>'+(i+1)+". "+n+'</b><small>'+((i%5==0)?"אתגר מיוחד":"וריאציה")+"</small></button>").join("")}
function add(){let a=g.map((v,i)=>v?null:i).filter(v=>v!=null);if(a.length){let i=a[Math.random()*a.length|0];g[i]=Math.random()<.9?2:4}}
function newGame(){S=+size.value;g=Array(S*S).fill(0);score=0;moves=0;h=[];add();add();save();render()}
function slide(a){a=a.filter(Boolean),o=[];for(let i=0;i<a.length;i++){if(a[i]==a[i+1])o.push(a[i]*2),score+=a[i]*2,i++;else o.push(a[i])}while(o.length<S)o.push(0);return o}
function move(d){let old=g.slice(),os=score,x=Array(S*S).fill(0);if(d=="L"||d=="R")for(let r=0;r<S;r++){let a=g.slice(r*S,r*S+S);if(d=="R")a.reverse();a=slide(a);if(d=="R")a.reverse();a.forEach((v,c)=>x[r*S+c]=v)}else for(let c=0;c<S;c++){let a=[];for(let r=0;r<S;r++)a.push(g[r*S+c]);if(d=="D")a.reverse();a=slide(a);if(d=="D")a.reverse();for(let r=0;r<S;r++)x[r*S+c]=a[r]}if(x.join()==g.join())return;h.push([old,os]);g=x;moves++;add();save();render();if(!g.includes(0)&&!can())setTimeout(()=>alert("אין יותר מהלכים 😅"),30)}
function can(){for(let r=0;r<S;r++)for(let c=0;c<S;c++){let i=r*S+c;if(c<S-1&&g[i]==g[i+1]||r<S-1&&g[i]==g[i+S])return 1}return 0}
function undo(){let x=h.pop();if(x){g=x[0];score=x[1];moves--;save();render()}}
function save(){localStorage.uSave=JSON.stringify({S,g,score,moves,mode});let b=+localStorage.uBest||0;if(score>b)localStorage.uBest=score}
function render(){board.style.gridTemplateColumns="repeat("+S+",1fr)";board.innerHTML=g.map(v=>'<div class="cell" data-v="'+v+'">'+(v||"")+"</div>").join("");sc.textContent=score;be.textContent=Math.max(score,+localStorage.uBest||0);mv.textContent=moves;info.innerHTML='<div class="row"><span>לוח</span><b>'+S+"×"+S+'</b></div><div class="row"><span>מצב</span><b>'+(mode+1)+". "+N[mode]+'</b></div><div class="row"><span>שיא</span><b>'+(localStorage.uBest||0)+'</b></div>';let A=[["🎯 מהלך ראשון",moves>0],["🔥 1,000",score>=1000],["💎 2048",g.includes(2048)],["⚡ 100 מהלכים",moves>=100],["🏆 500 מהלכים",moves>=500]];ach.innerHTML=A.map(x=>'<div class="ach">'+x[0]+" — "+(x[1]?"הושלם ✓":"נעול")+"</div>").join("");daily.innerHTML='<div class="row">'+(score>=2048?"✅":"⬜")+" צבור 2,048 נקודות</div><div class="row">"+(moves>=30?"✅":"⬜")+" בצע 30 מהלכים</div><div class="row">"+(g.includes(128)?"✅":"⬜")+" צור 128</div>"}
function tab(id,b){document.querySelectorAll(".panel").forEach(x=>x.classList.remove("on"));document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("on"));document.getElementById(id).classList.add("on");b.classList.add("on")}
const T=[["#f4f1ea","#fffaf0","#3c3a32","#8f6bff"],["#171717","#252525","#eee","#7c8cff"],["#f3eddf","#fffaf0","#3b3328","#9b6b32"],["#eaf1f8","#fff","#1a2735","#3c83d9"],["#080b0a","#0e1411","#b9ffc9","#31e875"],["#fff5fb","#fff","#292133","#e84f9b"]];
function setOpen(v){modal.style.display=v?"grid":"none";if(v)themes.innerHTML=T.map((t,i)=>'<button class="theme" onclick="theme('+i+')"><div style="height:24px;border-radius:7px;background:'+t[0]+'"></div>ממשק '+(i+1)+'</button>').join("")}
function theme(i){let t=T[i];["bg","card","t","a"].forEach((x,j)=>document.documentElement.style.setProperty("--"+x,t[j]));localStorage.uTheme=i}
document.addEventListener("keydown",e=>{let d={ArrowLeft:"L",ArrowRight:"R",ArrowUp:"U",ArrowDown:"D"}[e.key];if(d){e.preventDefault();move(d)}});let sx=0,sy=0;board.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});board.addEventListener("touchend",e=>{let x=e.changedTouches[0].clientX-sx,y=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(x),Math.abs(y))>22)move(Math.abs(x)>Math.abs(y)?x>0?"R":"L":y>0?"D":"U")},{passive:true});
makeModes();if(localStorage.uTheme)theme(+localStorage.uTheme);let z=JSON.parse(localStorage.uSave||"null");if(z){S=z.S;g=z.g;score=z.score;moves=z.moves;mode=z.mode||0;size.value=S;makeModes();render()}else newGame();
</script></body></html>
