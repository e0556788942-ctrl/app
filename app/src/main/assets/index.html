<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>עזרה ראשונה</title>
<style>body{margin:0;background:#f4f6f8;color:#182027;font-family:Arial;max-width:340px;margin:auto}header{background:#b71c1c;color:white;padding:12px}h1{font-size:23px;margin:0}p{line-height:1.45}.box{background:white;margin:8px;padding:14px;border-radius:12px;box-shadow:0 2px 7px #0001}.em{background:#d32f2f;color:#fff;border:0;width:100%;padding:17px;border-radius:12px;font-size:21px;font-weight:bold}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.card{cursor:pointer}.icon{font-size:23px}.step{border-right:5px solid #c62828}.warn{border-right:5px solid #e09b00;background:#fff5d6}.back{border:0;padding:10px;border-radius:9px}.hide{display:none}input{width:100%;padding:12px;border:2px solid #ddd;border-radius:10px;font-size:17px;box-sizing:border-box}</style>
<header><h1>🚑 עזרה ראשונה</h1><p>מדריך אופליין ל־M393</p></header><main id="home"><div class="box"><button class="em" onclick="show('emergency')">🆘 מצב חירום</button></div><div class="box"><input id="q" placeholder="🔎 חיפוש..." oninput="render()"></div><h2>קטגוריות</h2><div id="list" class="grid"></div><div class="box warn">⚠️ במצב מסכן חיים יש להזעיק מיד את שירותי החירום. האפליקציה אינה מחליפה טיפול רפואי.</div></main>
<main id="page" class="hide"><button class="back" onclick="back()">← חזרה</button><div id="content"></div></main>
<script>const g=[
['emergency','🆘','מצב חירום',['ודא שהמקום בטוח.','בדוק תגובה ונשימה והזעק עזרה מקצועית לפי הצורך.','פעל לפי הנחיות מוקד החירום.']],
['bleeding','🩸','דימום וחתכים',['התרחק ממקור הסכנה והשתמש במחסום אם זמין.','הפעל לחץ ישיר ויציב עם חומר נקי.','אם הדימום משמעותי או אינו נשלט, הזעק שירותי חירום.']],
['burn','🔥','כוויות',['הרחק ממקור החום אם בטוח לעשות זאת.','קרר את אזור הכוויה במים זורמים בטמפרטורה נעימה.','אין לפוצץ שלפוחיות ואין למרוח חומרים ביתיים.']],
['choking','🫁','חנק',['עודד שיעול אם האדם מסוגל להשתעל ולנשום.','אם אינו מסוגל לנשום או להשתעל כראוי, הזעק מיד שירותי חירום ופעל לפי ההנחיות.','אם יש אובדן הכרה, פעל לפי מוקד החירום.']],
['fall','🤕','נפילה וחבלה',['ודא שהסביבה בטוחה.','אל תזיז את האדם ללא צורך.','בפגיעה משמעותית או שינוי בהכרה, הזעק שירותי חירום.']],
['allergy','⚠️','תגובה אלרגית',['בקושי נשימתי, נפיחות משמעותית או הידרדרות מהירה — הזעק מיד שירותי חירום.','פעל לפי טיפול חירום שנרשם לאדם.','השאר אותו בהשגחה ופעל לפי המוקד.']],
['sprain','🦶','נקע וחבלה',['הפסק פעילות והימנע מהעמסה.','הרם את הגפה אם נוח ואינו גורם לכאב נוסף.','בעיוות, כאב חזק או חוסר תחושה — פנה לטיפול רפואי.']]];
function render(){let q=document.getElementById('q').value.trim().toLowerCase();list.innerHTML=g.filter(x=>(x[2]+' '+x[3].join(' ')).toLowerCase().includes(q)).map(x=>'<div class="box card" onclick="show(\''+x[0]+'\')"><div class="icon">'+x[1]+'</div><b>'+x[2]+'</b></div>').join('')}function show(id){let x=g.find(a=>a[0]===id);home.className='hide';page.className='';content.innerHTML='<h2>'+x[1]+' '+x[2]+'</h2><div class="box warn">⚠️ מידע כללי בלבד. במקרה חירום פנה לשירותי החירום.</div>'+x[3].map((s,i)=>'<div class="box step"><b>שלב '+(i+1)+'</b><p>'+s+'</p></div>').join('');scrollTo(0,0)}function back(){page.className='hide';home.className='';scrollTo(0,0)}render()</script>
